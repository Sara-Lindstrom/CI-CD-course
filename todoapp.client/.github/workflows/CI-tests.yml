name: Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend-unit-tests:
    name: Backend unit tests (.NET)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore .NET solution
        run: dotnet restore ToDoApp.sln

      - name: Run backend unit tests
        run: dotnet test TodoApp.Server.Tests/TodoApp.Server.Tests.csproj -c Release --no-restore

  api-integration-tests:
    name: API integration tests (Postman/Newman)
    runs-on: ubuntu-latest
    needs: backend-unit-tests
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: TodoApp.client/package-lock.json

      - name: Install client dependencies
        working-directory: TodoApp.client
        run: npm ci

      - name: Start backend
        run: |
          dotnet run --project TodoApp.Server/TodoApp.Server.csproj --urls http://127.0.0.1:5000 &
          echo "Waiting for backend to accept connections on :5000..."
          for i in {1..45}; do
            nc -z 127.0.0.1 5000 && echo "Backend is up!" && exit 0
            sleep 1
          done
          echo "Backend did not start in time" >&2
          exit 1

      - name: API Integration Tests (Newman)
        working-directory: TodoApp.client
        run: npm run test:api

  playwright-e2e:
    name: Playwright E2E (chromium, firefox, webkit)
    runs-on: ubuntu-latest
    needs: api-integration-tests
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: TodoApp.client/package-lock.json

      - name: Install client dependencies
        working-directory: TodoApp.client
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('TodoApp.client/package-lock.json') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: TodoApp.client
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Install Playwright deps (if cached)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        working-directory: TodoApp.client
        run: npx playwright install-deps chromium firefox webkit

      - name: Build client
        working-directory: TodoApp.client
        run: npm run build

      - name: Start backend
        run: |
          dotnet run --project TodoApp.Server/TodoApp.Server.csproj --urls http://127.0.0.1:5000 &
          echo "Waiting for backend to accept connections on :5000..."
          for i in {1..45}; do
            nc -z 127.0.0.1 5000 && echo "Backend is up!" && exit 0
            sleep 1
          done
          echo "Backend did not start in time" >&2
          exit 1

      - name: E2E Tests (Playwright)
        working-directory: TodoApp.client
        run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: TodoApp.client/playwright-report/
          retention-days: 7

