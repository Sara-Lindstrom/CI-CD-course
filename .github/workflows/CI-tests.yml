  playwright-e2e:
    name: Playwright E2E (chromium, firefox, webkit)
    runs-on: ubuntu-latest
    needs: api-integration-tests
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: todoapp.client/package-lock.json

      - name: Install client dependencies
        working-directory: todoapp.client
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('todoapp.client/package-lock.json') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: todoapp.client
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Install Playwright deps (if cached)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        working-directory: todoapp.client
        run: npx playwright install-deps chromium firefox webkit

      - name: Build client
        working-directory: todoapp.client
        run: npm run build

      - name: Start backend (port 5159)
        run: |
          dotnet run --project TodoApp.Server/TodoApp.Server.csproj --urls http://127.0.0.1:5159 &
          echo "Waiting for backend to accept connections on :5159..."
          for i in {1..60}; do
            curl -fsS http://127.0.0.1:5159/ >/dev/null 2>&1 && echo "Backend is up!" && exit 0
            sleep 1
          done
          echo "Backend did not start in time" >&2
          exit 1

      - name: E2E Tests (Playwright)
        working-directory: todoapp.client
        run: npx playwright test

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: todoapp.client/playwright-report/
          retention-days: 7

